name: Native repository kernel

on:
  pull_request:
    paths:
      - 'packages/tofu-repo-kernel/**'
      - 'lib/repo_map/**'
      - 'tests/repo_map/**'
      - 'benchmarks/repository_index/**'
      - '.github/workflows/native-repo-kernel.yml'
      - '.github/workflows/publish-developer-runtime.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tests/installer/test_native_kernel_delivery.py'
  push:
    branches: [main, master]
    paths:
      - 'packages/tofu-repo-kernel/**'
      - 'lib/repo_map/**'
      - 'tests/repo_map/**'
      - 'benchmarks/repository_index/**'
      - '.github/workflows/native-repo-kernel.yml'
      - '.github/workflows/publish-developer-runtime.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tests/installer/test_native_kernel_delivery.py'

permissions:
  contents: read

jobs:
  native-abi-scope:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect the declared internal native ABI checker
        id: detect
        run: >-
          python .github/scripts/native_abi_oracle.py detect
          --github-output "$GITHUB_OUTPUT"

  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Install build and application test dependencies
        run: python -m pip install build==1.6.1 setuptools==80.10.2 wheel==0.48.0 pytest==9.1.1 networkx==3.6.1 scipy==1.18.1 '.[test]'
      - name: Build and install standalone platform wheel
        env:
          RUSTUP_TOOLCHAIN: '1.85.1'
        run: |
          python -m build --no-isolation --outdir /tmp/tofu-native-dist packages/tofu-repo-kernel
          python -m pip install --no-deps /tmp/tofu-native-dist/*.whl
      - name: Verify native selection, graph parity and task consumer contracts
        run: python -m pytest -q tests/repo_map tests/meta/test_repo_map.py tests/tasks_pkg/test_repo_map_handler.py tests/installer/test_native_kernel_delivery.py tests/installer/test_docker_reliability_contract.py tests/release/test_developer_runtime_distribution.py
      - name: Publish the standalone kernel wheel for the raw ABI oracle
        uses: actions/upload-artifact@v4
        with:
          name: native-kernel-wheel
          path: /tmp/tofu-native-dist/*.whl
          if-no-files-found: error
          retention-days: 1

  raw-native-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [native-abi-scope, installed-wheel]
    if: ${{ needs.native-abi-scope.outputs.available == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native ABI oracle dependencies
        run: python -m pip install networkx==3.6.1
      - name: Consume the standalone kernel wheel
        uses: actions/download-artifact@v4
        with:
          name: native-kernel-wheel
          path: /tmp/tofu-native-dist
      - name: Install the verified standalone wheel
        run: python -m pip install --no-deps /tmp/tofu-native-dist/*.whl
      - name: Verify raw native ABI oracle and failure output withholding
        run: python .github/scripts/native_abi_oracle.py run
