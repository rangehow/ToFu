[package]
name = "tofudb-domain-roots"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tofu-db = { path = "../../packages/tofu-db", features = ["embedded-mimalloc"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32.1", features = ["bundled"] }
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
