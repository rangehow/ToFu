[package]
name = "tofudb-harness-graph"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "tofu_db_harness_graph"

[features]
default = []
sqlite-reference = []

[dependencies]
tofu-db = { path = "../../packages/tofu-db", features = ["embedded-mimalloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
