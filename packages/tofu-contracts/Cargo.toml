[package]
name = "tofu-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Serde types generated from Tofu's machine-readable HTTP and event contracts"
publish = false

# Standalone like tofu-workspace: joining the root workspace would change the
# lock file that tofu-runtime's build fingerprint reads.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
