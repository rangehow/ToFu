[package]
name = "tofu-front-push"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Phase 1e of the Rust front door: the WS /api/push multiplex (PushHub) with a Python publish bridge"
publish = false

# Standalone library manifest and lock; no parent executable host or manifest
# is tracked under packages/tofu-front-rs. A host may depend on this crate by path.
[workspace]

[dependencies]
tofu-contracts = { path = "../../tofu-contracts" }
tokio = { version = "1.51", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# arbitrary_precision keeps a number's literal so the pong echo of `t`
# reproduces Python's json.loads/json.dumps round trip (python_json.rs).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "connect"] }
hyper = { version = "1.12", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto"] }

[lints.rust]
unsafe_code = "forbid"
