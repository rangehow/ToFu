[package]
name = "tofu-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of Tofu's MCP client (lib/mcp)"
publish = false

# Standalone like packages/tofu-core-rs: its own lock and build.
[workspace]

[[bin]]
name = "tofu-mcp-host"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "10", features = ["tokio1"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process", "io-util", "io-std", "net"] }
tokio-util = "0.7"
async-trait = "0.1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
libc = "0.2"
toml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
futures = "0.3"
sse-stream = "0.2"

[dev-dependencies]
tempfile = "3"
