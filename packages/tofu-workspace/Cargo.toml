[package]
name = "tofu-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Standalone native workspace and immutable revision prototype"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
rustix = { version = "1", features = ["fs"] }
cap-std = "3"
tempfile = "3"

[[bin]]
name = "tofu-git"
path = "src/bin/tofu_git.rs"

[dev-dependencies]
