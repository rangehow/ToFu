<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MINIMAL — the subtraction bet.
       One flat cream block, two dark eyes, nothing else: no gradients, no
       sheen, no blush, no internal edges. Everything that survives at 16px
       is kept; everything that only reads at 64px is cut. The silhouette
       does the identifying, not the detail. -->
  <path d="M32 8 L55 20.5 L55 43.5 L32 56 L9 43.5 L9 20.5 Z"
        fill="#F7E6C4" stroke="#221E2A" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M9 20.5 L32 33 L55 20.5" fill="none"
        stroke="#221E2A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.28"/>
  <rect x="18.5" y="36.5" width="6" height="9" rx="3" fill="#221E2A"/>
  <rect x="34.5" y="40" width="6" height="9" rx="3" fill="#221E2A"/>
  <path d="M26.5 47.5 Q29.5 50.5 32.5 47.9" fill="none" stroke="#221E2A"
        stroke-width="2.6" stroke-linecap="round"/>
</svg>
