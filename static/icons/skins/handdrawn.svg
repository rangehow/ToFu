<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- HAND-DRAWN — my own read of six rounds of rejections.
       Every geometric redraw got the same verdict: clean but cold. The one
       the owner keeps returning to is the ORIGINAL, whose charm is exactly
       what precision destroys — slightly-off edges, a soft wobble, the sense
       that a hand made it. So this bet is NOT "cleaner": it deliberately
       keeps the original's chunky proportions and puts the imperfection back
       in on purpose — an outline that breathes (varying curvature, no two
       corners identical), warm layered shading instead of a flat ramp, and a
       face that sits slightly off-centre the way a drawn one would.
       Craft warmth, not craft precision. -->
  <defs>
    <linearGradient id="hTop" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset="1" stop-color="#FAEBCE"/>
    </linearGradient>
    <linearGradient id="hLeft" x1="0" y1="0.1" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FBF0DA"/>
      <stop offset="0.6" stop-color="#F4E0BB"/>
      <stop offset="1" stop-color="#EDD5AA"/>
    </linearGradient>
    <linearGradient id="hRight" x1="0.1" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#EBD5AF"/>
      <stop offset="1" stop-color="#DCC091"/>
    </linearGradient>
  </defs>

  <!-- Faces. Corners are deliberately unequal: the top-left vertex sits a
       touch high, the right shoulder droops — a drawn cube, not a plotted one. -->
  <path d="M31.4 7.2 Q32.6 6.8 33.8 7.5 L55.4 18.6 Q56.2 19.1 55.3 19.7
           L33.2 31.4 Q32.2 31.9 31.2 31.3 L9.4 19.9 Q8.5 19.4 9.3 18.9 Z"
        fill="url(#hTop)"/>
  <path d="M9.1 19.6 L31.4 31.3 Q32.2 31.7 32.1 32.6 L32.0 54.9
           Q31.9 55.9 31.0 55.4 L9.6 43.9 Q8.7 43.4 8.8 42.5 L8.7 20.2 Z"
        fill="url(#hLeft)"/>
  <path d="M32.6 31.4 L55.4 19.5 Q56.3 19.0 56.2 20.0 L56.0 42.7
           Q55.9 43.6 55.1 44.0 L33.4 55.3 Q32.5 55.8 32.5 54.8 L32.5 32.4 Z"
        fill="url(#hRight)"/>

  <!-- A soft occlusion under the top face — depth from shading, not from a line. -->
  <path d="M9.6 20.6 L31.6 32.2 L54.8 20.3" fill="none"
        stroke="#C9A97C" stroke-width="2.6" stroke-linecap="round" opacity="0.30"/>

  <!-- Outline drawn as separate strokes with different weights: the lit top-left
       reads thinner, the shaded lower-right heavier — the way a pen presses. -->
  <path d="M31.4 7.2 Q32.6 6.8 33.8 7.5 L55.4 18.6 Q56.4 19.2 56.2 20.4
           L56.0 42.7 Q55.9 43.7 55.0 44.1"
        fill="none" stroke="#231F2B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55.0 44.1 L33.3 55.4 Q32.4 55.9 31.4 55.5 L9.5 44.0
           Q8.6 43.5 8.7 42.4"
        fill="none" stroke="#231F2B" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M8.7 42.4 L8.7 20.2 Q8.5 19.2 9.4 18.8 L31.4 7.2"
        fill="none" stroke="#231F2B" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Interior creases: lighter and slightly broken, like a re-traced pencil line. -->
  <path d="M9.4 19.5 Q20.5 25.4 31.5 31.2" fill="none"
        stroke="#231F2B" stroke-width="2.1" stroke-linecap="round" opacity="0.9"/>
  <path d="M32.7 31.2 Q44.0 25.4 55.2 19.4" fill="none"
        stroke="#231F2B" stroke-width="2.1" stroke-linecap="round" opacity="0.9"/>
  <path d="M32.1 32.6 Q32.3 44.0 32.0 54.7" fill="none"
        stroke="#231F2B" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Face on the front-left plane. Eyes are NOT identical twins: the right one
       is a hair larger and lower, which is what makes a drawn face feel alive. -->
  <g transform="matrix(1,0.5,0,1,8.8,19.4)">
    <path d="M6.4 6.9 Q9.0 6.4 9.3 9.6 L9.4 13.1 Q9.2 15.8 6.9 15.4
             Q4.6 15.0 4.6 12.0 L4.7 9.2 Q4.7 7.3 6.4 6.9 Z" fill="#231F2B"/>
    <path d="M16.4 6.6 Q19.2 6.2 19.5 9.5 L19.6 13.4 Q19.4 16.3 16.9 15.9
             Q14.5 15.5 14.5 12.3 L14.6 9.1 Q14.6 7.0 16.4 6.6 Z" fill="#231F2B"/>
    <ellipse cx="7.9" cy="9.2" rx="1.25" ry="1.05" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="17.9" cy="9.0" rx="1.35" ry="1.1" fill="#FFFFFF" opacity="0.95"/>
    <!-- ω mouth, hand-inked: the two humps are not the same size -->
    <path d="M9.4 16.2 Q10.8 18.1 12.0 16.1 Q13.1 18.4 14.7 16.3"
          fill="none" stroke="#231F2B" stroke-width="1.35" stroke-linecap="round"/>
    <!-- Blush: soft, uneven, slightly bleeding past where it "should" be -->
    <ellipse cx="3.3" cy="17.6" rx="2.5" ry="1.5" fill="#F79A92" opacity="0.62"/>
    <ellipse cx="20.7" cy="17.9" rx="2.2" ry="1.35" fill="#F79A92" opacity="0.55"/>
  </g>

  <!-- Highlight lives in the top-face gradient itself (a separate white stroke
       read as a stray bar laid across the lid, so it is gone on purpose). -->
</svg>
